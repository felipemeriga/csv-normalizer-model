[project]
name = "csv-normalizer"
version = "0.1.0"
description = "Normalize CSV bank exports from Brazilian banks using a fine-tuned local model"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.0",
    "transformers>=4.36",
    "peft>=0.7",
    "bitsandbytes>=0.41",
    "trl>=0.7",
    "pandas>=2.0",
    "pydantic>=2.0",
    "fastapi>=0.104",
    "uvicorn>=0.24",
    "chardet>=5.0",
    "datasets>=2.14",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1",
    "httpx>=0.25",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
